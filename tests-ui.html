<!doctype html><html lang="en"><meta charset="utf-8"><title>UI checks</title><body><pre id="results">Running…</pre><iframe id="app" title="App under test" width="1100" height="950"></iframe><script type="module">
const log=[], frame=document.getElementById('app'), storageKey='practice-room.sessions.v1', backup=localStorage.getItem(storageKey);
function assert(value,message){if(!value)throw new Error(message)}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const load=()=>new Promise(resolve=>{frame.onload=resolve;frame.src='./?test='+Date.now()});
try {
localStorage.removeItem(storageKey);await load();
let w=frame.contentWindow,d=w.document,$=id=>d.getElementById(id);
assert($('chord-a').options.length===17,'chords load');assert($('empty-log').hidden===false,'empty log');
log.push('PASS App initialises with chord selection and empty history');
d.querySelector('.swap').dispatchEvent(new w.MouseEvent('click',{bubbles:true}));
assert($('chord-a').value==='D'&&$('chord-b').value==='A','swap exchanges chord selections');
d.querySelector('.swap').dispatchEvent(new w.MouseEvent('click',{bubbles:true}));
assert($('chord-a').value==='A'&&$('chord-b').value==='D','swap restores chord order');
log.push('PASS Swap button exchanges both chord selections');
$('chord-b').value='A';$('chord-b').dispatchEvent(new w.Event('change'));assert($('listen').disabled,'same pair disabled');$('chord-b').value='D';$('chord-b').dispatchEvent(new w.Event('change'));
log.push('PASS Identical chords cannot start a round');
const nativeTimeout=w.setTimeout.bind(w);w.setTimeout=(fn,ms,...args)=>nativeTimeout(fn,ms===60000?80:ms,...args);
$('manual').click();assert($('tap').hidden===false,'manual ready');assert($('count').textContent==='0','waits for first tap');$('tap').click();assert($('count').textContent==='1','first tap counted');
d.dispatchEvent(new w.KeyboardEvent('keydown',{code:'Space',bubbles:true}));assert($('count').textContent==='2','space counted');
d.dispatchEvent(new w.KeyboardEvent('keydown',{code:'Space',repeat:true,bubbles:true}));assert($('count').textContent==='2','repeat ignored');
await wait(100);assert(!$('result').hidden,'result shown');assert($('final-count').value==='2','count copied');
log.push('PASS Manual start, Space counting, repeat prevention and completion');
$('final-count').value='-1';$('save').click();assert(!$('error').hidden,'invalid result error');
$('final-count').value='12';$('save').click();assert($('result').hidden,'result closed');assert($('session-total').textContent==='1 session','saved row');assert(JSON.parse(localStorage.getItem(storageKey))[0].count===12,'saved corrected count');
log.push('PASS Invalid result rejected and corrected result saved');
await load();w=frame.contentWindow;d=w.document;$=id=>d.getElementById(id);assert($('session-total').textContent==='1 session','history persists');
d.querySelector('.swap').click();assert($('session-total').textContent==='1 session','reverse pair retains history');
log.push('PASS Saved history persists after reload and reversing pair');
$('manual').click();assert(d.querySelector('.swap').disabled,'swap disabled during round');d.querySelector('.swap').click();assert($('chord-a').value==='D','active pair unchanged');$('cancel').click();assert(!d.querySelector('.swap').disabled,'swap enabled after cancel');assert(!$('listen').hidden,'cancel restores controls');assert($('count').textContent==='0','cancel clears count');
log.push('PASS Cancel restores ready state');
Object.defineProperty(w,'AudioContext',{value:class {state='running';resume(){return Promise.resolve()}close(){return Promise.resolve()}}});
Object.defineProperty(w.navigator.mediaDevices,'getUserMedia',{configurable:true,value:()=>Promise.reject(new DOMException('Denied','NotAllowedError'))});
$('listen').click();await wait(30);assert(!$('error').hidden&&$('error').textContent.includes('blocked'),'permission error');assert(!$('manual').hidden,'manual fallback available');
log.push('PASS Denied microphone gives recovery and manual fallback');
let resolveMic, stopped=false;
Object.defineProperty(w.navigator.mediaDevices,'getUserMedia',{configurable:true,value:()=>new Promise(r=>resolveMic=r)});
$('listen').click();await wait(10);$('cancel').click();resolveMic({getTracks:()=>[{stop:()=>{stopped=true}}]});await wait(10);assert(stopped,'late stream stopped');assert(!$('listen').hidden,'cancel stays cancelled');
log.push('PASS Cancelling a pending mic request releases late-arriving stream');
let now=0, amplitude=.001, nextFrame, micStopped=false;
Object.defineProperty(w.performance,'now',{value:()=>now});
w.requestAnimationFrame=cb=>{nextFrame=cb;return 1};w.cancelAnimationFrame=()=>{nextFrame=null};
Object.defineProperty(w,'AudioContext',{value:class {state='running';resume(){return Promise.resolve()}close(){return Promise.resolve()}createAnalyser(){return {fftSize:1024,getFloatTimeDomainData:buffer=>buffer.fill(amplitude)}}createMediaStreamSource(){return {connect(){}}}}});
Object.defineProperty(w.navigator.mediaDevices,'getUserMedia',{configurable:true,value:()=>Promise.resolve({getTracks:()=>[{stop:()=>{micStopped=true}}]})});
$('listen').click();await wait(20);assert($('status').textContent.includes('quiet'),'calibration starts');
now=1600;nextFrame();assert($('status').textContent.includes('first strum'),'armed after calibration');assert($('timer').textContent==='1:00'&&$('count').textContent==='0','silence does not start');
amplitude=.12;now=1700;nextFrame();assert($('count').textContent==='1','mic attack starts and counts');
for(let i=0;i<30;i++){now+=16;amplitude=.001;nextFrame()}
amplitude=.12;now=2500;nextFrame();assert($('count').textContent==='2','second strum counts');
now=61700;nextFrame();assert(!$('result').hidden&&$('final-count').value==='2','mic round completes at deadline');assert(micStopped,'mic released at finish');
log.push('PASS Microphone calibration, first-strum start, counting, deadline and release');
$('discard').click();
assert(d.documentElement.scrollWidth<=w.innerWidth,'desktop overflow');
frame.width='340';await wait(40);assert(d.documentElement.scrollWidth<=w.innerWidth,'mobile overflow');log.push('PASS No horizontal overflow at desktop or 340px');
} catch(e){log.push('FAIL '+e.message)}finally{if(backup===null)localStorage.removeItem(storageKey);else localStorage.setItem(storageKey,backup)}
document.getElementById('results').textContent=log.join('\n');document.title=log.some(s=>s.startsWith('FAIL'))?'FAIL':'PASS';
</script></body></html>
