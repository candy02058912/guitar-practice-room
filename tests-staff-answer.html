<!doctype html><html lang="en"><meta charset="utf-8"><title>Staff answer checks</title><pre id="results">Running…</pre><iframe id="app" title="Fretboard staff answer test" width="1100" height="1900"></iframe><script type="module">
import {writtenPitch} from './staff-answer.js';
import {STRINGS,position,LEVEL_KEY} from './fretboard-engine.js';
const results=[];function assert(x,msg='assertion failed'){if(!x)throw Error(msg)}
async function test(name,fn){try{await fn();results.push('PASS '+name)}catch(e){results.push('FAIL '+name+': '+e.message)}}
await test('Every guitar position maps to written pitch with exact octave',()=>{for(let s=0;s<6;s++)for(let f=0;f<=12;f++){const n=writtenPitch(STRINGS[s].midi+f);assert(n.midi===STRINGS[s].midi+f);assert(n.step>=23&&n.step<=44)}assert(writtenPitch(40).id==='E3');assert(writtenPitch(76).id==='E6');assert(writtenPitch(60).id==='C5')});
const frame=document.getElementById('app'), keys=[LEVEL_KEY,'practice-room.fretboard.v1','practice-room.fretboard.staff.levels.v1','practice-room.fretboard.staff.v1'];
const backup=keys.map(k=>localStorage.getItem(k));
const load=()=>new Promise(resolve=>{frame.onload=async()=>{await frame.contentDocument.fonts.ready;for(let i=0;i<100&&frame.contentDocument.getElementById('start').disabled;i++)await new Promise(r=>setTimeout(r,20));resolve()};frame.src='./fretboard.html?answer=staff&t='+Date.now()});
try {
 keys.forEach(k=>localStorage.removeItem(k));await load();let d=frame.contentDocument,$=id=>d.getElementById(id),svg=()=>d.querySelector('.answer-staff'),click=id=>$(id).click();
 const key=k=>svg().dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true,cancelable:true}));
 function target(){const [s,f]=d.querySelector('.fret.target').dataset.position.split(':').map(Number);return position(s,f)}
 function place(n){key('Home');for(let i=23;i<n.step;i++)key('ArrowUp');const sel=d.querySelector('#staff-answer select');sel.value=n.accidental;sel.dispatchEvent(new Event('change'))}
 function correct(){place(writtenPitch(target().midi));key('Enter')}
 await test('Staff mode starts with fret position prompt and empty staff, without letter answers',()=>{assert($('practice-mode').value==='staff');click('start');assert(!$('staff-answer').hidden&&$('typed-answer-form').hidden&&$('note-answers').hidden);assert(d.querySelector('.fret.target'));assert(!svg().querySelector('.note-head'));assert(d.activeElement===svg());assert(d.querySelector('#staff-answer button').disabled);assert(!$('prompt-help').textContent.includes(target().name+' '))});
 await test('Pointer places a note without submitting and arrows adjust it',()=>{const pt=new DOMPoint(231,110).matrixTransform(svg().getScreenCTM());svg().dispatchEvent(new MouseEvent('click',{clientX:pt.x,clientY:pt.y,bubbles:true}));assert(svg().querySelector('.note-head').getAttribute('cy')==='110');assert($('next').hidden);key('ArrowUp');assert(svg().querySelector('.note-head').getAttribute('cy')==='100')});
 await test('Correct pitch class in the wrong octave is rejected and correct staff position revealed',()=>{const n=writtenPitch(target().midi);place({...n,step:n.step-7});key('Enter');assert(!$('next').hidden&&$('level-meter').value===0);assert(d.querySelector('.staff-selection').textContent.includes(n.id));assert(svg().getAttribute('aria-disabled')==='true');assert(d.querySelector('.staff-result strong').textContent==='Not quite');assert(svg().querySelectorAll('.note-head').length===2);assert(svg().querySelector('.chosen-note'));assert(d.querySelector('.staff-answer-controls').hidden)});
 await test('Staff answers progress through six questions with Enter focus flow',()=>{for(let i=0;i<5;i++){click('next');assert(d.activeElement===svg());correct();assert(d.activeElement===$('next'));assert(d.querySelector('.staff-result strong').textContent==='Correct!');assert(svg().querySelectorAll('.note-head').length===1)}click('next');assert($('prompt').textContent==='5 of 6 recalled without help');assert($('staff-answer').hidden);assert(localStorage.getItem(LEVEL_KEY)===null);assert(localStorage.getItem('practice-room.fretboard.v1')===null)});
 await test('Separate practice completes, persists and switches back to unchanged letter mode',async()=>{click('start');for(let i=0;i<6;i++){correct();click('next')}assert(!$('advance').hidden);await load();d=frame.contentDocument;assert($('path-count').textContent==='1 / 24 complete');$('practice-mode').value='screen';$('practice-mode').dispatchEvent(new Event('change'));assert($('path-count').textContent==='0 / 24 complete');click('start');assert(!$('typed-answer-form').hidden&&$('staff-answer').hidden);click('explore')});
 await test('Full-neck enharmonic answers and high/low ledger positions are available',()=>{ $('practice-mode').value='staff';$('practice-mode').dispatchEvent(new Event('change'));$('scope').value='full';$('scope').dispatchEvent(new Event('change'));click('start');for(let i=0;i<6;i++){const p=target(),n=writtenPitch(p.midi);if(n.accidental==='#'){place({...n,step:n.step+1,accidental:'b'});key('Enter')}else correct();assert($('feedback').textContent.startsWith('Yes!'));click('next')}click('start');key('Home');assert(svg().getAttribute('aria-valuenow')==='23');key('End');assert(svg().getAttribute('aria-valuenow')==='44');click('reveal');assert(d.querySelector('.staff-selection').textContent.includes('Correct position'));assert(d.querySelector('.staff-result strong').textContent==='Answer revealed')});
 await test('Staff answering fits phone width',async()=>{frame.width=360;await new Promise(r=>setTimeout(r,100));assert(d.documentElement.scrollWidth<=frame.contentWindow.innerWidth)});
}finally{keys.forEach((k,i)=>backup[i]===null?localStorage.removeItem(k):localStorage.setItem(k,backup[i]))}
document.getElementById('results').textContent=results.join('\n');document.title=results.some(r=>r.startsWith('FAIL'))?'FAIL':'PASS';
</script></html>
