<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9e6">
  <meta name="description" content="Practice along with smallpancakes’s guitar diary. Tools for chord changes, keeping time, and learning the fretboard—with note-name and staff answers."><meta property="og:site_name" content="smallpancakes’s guitar practice room"><meta property="og:title" content="smallpancakes’s guitar practice room"><meta property="og:description" content="Practice along with smallpancakes’s guitar diary. Tools for chord changes, keeping time, and learning the fretboard—with note-name and staff answers."><meta property="og:type" content="website">
  <script src="palette.js"></script><link rel="stylesheet" href="palettes.css">
  <title>smallpancakes’s guitar practice room · Metronome</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="style.css?v=4">
  <script type="module" src="metronome.js?v=1"></script>
</head>
<body>
  <header class="site-header"><a class="wordmark" href="./" aria-label="smallpancakes’s guitar practice room home"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M6 4v20M14 4v20M22 4v20M3 9h22M3 19h22"/><circle cx="14" cy="9" r="3"/><circle cx="6" cy="19" r="3"/></svg><span class="wordmark-text"><span class="wordmark-owner">smallpancakes’s</span><span>guitar practice room<span class="wordmark-dot">.</span></span></span></a><div class="header-actions"><label class="palette-control language-control" for="language">Language<select id="language" translate="no"><option value="en" lang="en">English</option><option value="zh-Hant" lang="zh-Hant">繁體中文</option></select></label><label class="palette-control" for="palette">Palette<select id="palette"><option value="pancake">Pancake</option><option value="pastel">Original pastel</option></select></label></div></header>
  <main>
    <nav class="tool-nav" aria-label="Practice tools"><a href="./">One minute changes</a><a href="metronome.html" aria-current="page">Metronome</a><a href="fretboard.html">Fretboard</a></nav>
    <section class="intro"><h1>Metronome</h1></section>
    <div class="workspace workspace-single">
      <section class="practice metronome-panel" aria-label="Metronome">
        <div class="metro-main">
        <div class="tempo-controls">
          <button class="step" id="tempo-minus" aria-label="Decrease tempo by 1 BPM">−</button>
          <div class="tempo-value"><label for="bpm">Beats per minute</label><input id="bpm" type="number" inputmode="numeric" min="40" max="240" step="1" value="80" aria-describedby="tempo-range"></div>
          <button class="step" id="tempo-plus" aria-label="Increase tempo by 1 BPM">+</button>
        </div>
        <div class="tempo-range"><input id="tempo-slider" type="range" min="40" max="240" step="1" value="80" aria-label="Tempo in beats per minute"><div class="range-labels" id="tempo-range"><span>40 BPM</span><span>240 BPM</span></div></div>
        <div class="beat-stage"><div id="beat-lights" class="beat-lights" role="list" aria-label="Beats in the bar"></div><p id="metro-status" role="status">Ready</p></div>
        <div class="metro-actions"><button id="metro-toggle" class="primary" aria-pressed="false">Start metronome</button><button id="tap-tempo" class="secondary">Tap tempo</button><p id="tap-help" role="status"></p></div>
        <p class="error" id="metro-error" role="alert" hidden></p>
        <p class="small-copy shortcut-hint">Space to start or stop</p>
        </div>
        <div class="metro-settings">
          <div class="meter-settings"><label for="beats-per-bar">Beats per bar<select id="beats-per-bar"><option value="1">1 beat</option><option value="2">2 beats</option><option value="3">3 beats</option><option value="4" selected>4 beats</option><option value="5">5 beats</option><option value="6">6 beats</option></select></label><label class="accent-setting"><input id="accent-first" type="checkbox" checked>Accent first beat</label></div>
          <label class="volume-label" for="volume">Volume <output id="volume-value">60%</output></label><input id="volume" type="range" min="0" max="100" value="60">
        </div>
      </section>
    </div>

  </main>
</body>
</html>
