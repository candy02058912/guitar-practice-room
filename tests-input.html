<!doctype html><html lang="en"><meta charset="utf-8"><title>Audio input checks</title><body><pre id="results">Running…</pre><iframe id="app" title="Audio input test" width="1100" height="1100"></iframe><script>
for (const type of ['error','unhandledrejection']) addEventListener(type,event=>{
 document.getElementById('results').textContent='FAIL Test harness: '+(event.message||event.reason?.stack||event.reason)+' at '+event.lineno+':'+event.colno;
 document.title='FAIL';
});
</script><script type="module">
const results=[],frame=document.getElementById('app');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function assert(value,message='assertion failed'){if(!value)throw new Error(message)}
async function test(name,run){try{await run();results.push('PASS '+name)}catch(e){results.push('FAIL '+name+': '+e.message)}}
await new Promise(resolve=>{frame.onload=resolve;frame.src='./?inputs=test'});
const w=frame.contentWindow,d=w.document,$=id=>d.getElementById(id);
let now=0,amplitude=.001,nextFrame,tracks=[],requests=[],devices=[{kind:'audioinput',deviceId:'mic',label:'Built-in microphone'},{kind:'audioinput',deviceId:'usb',label:'Mustang Micro Plus'},{kind:'audiooutput',deviceId:'speaker',label:'Speakers'}];
Object.defineProperty(w.performance,'now',{value:()=>now});
w.requestAnimationFrame=cb=>{nextFrame=cb;return 1};w.cancelAnimationFrame=()=>{nextFrame=null};
Object.defineProperty(w,'AudioContext',{value:class{state='running';resume(){return Promise.resolve()}close(){return Promise.resolve()}createAnalyser(){return{fftSize:1024,getFloatTimeDomainData:buffer=>buffer.fill(amplitude)}}createMediaStreamSource(){return{connect(){}}}}});
Object.defineProperty(w.navigator.mediaDevices,'enumerateDevices',{configurable:true,value:()=>Promise.resolve(devices)});
function makeStream(label='Mustang Micro Plus'){const track={label,stopped:false,stop(){this.stopped=true}};tracks.push(track);return{getTracks:()=>[track]}}
Object.defineProperty(w.navigator.mediaDevices,'getUserMedia',{configurable:true,value:options=>{requests.push(options);return Promise.resolve(makeStream(options.audio.deviceId?.exact==='mic'?'Built-in microphone':'Mustang Micro Plus'))}});
await test('Device refresh lists audio inputs without requesting permission',async()=>{
 $('refresh-inputs').click();await wait(20);assert($('audio-input').options.length===3);assert(requests.length===0);assert([...$('audio-input').options].some(o=>o.textContent==='Mustang Micro Plus'));
});
await test('USB check uses an exact device constraint and shows its actual name',async()=>{
 $('audio-input').value='usb';$('audio-input').dispatchEvent(new w.Event('change'));$('check-input').click();await wait(20);
 assert(requests.at(-1).audio.deviceId.exact==='usb');assert(requests.at(-1).audio.echoCancellation===false&&requests.at(-1).audio.autoGainControl===false);assert($('input-status').textContent.includes('Mustang Micro Plus'));assert($('check-input').textContent==='Stop check');
});
await test('Input preview shows signal and clipping without starting a round',()=>{
 amplitude=.12;now=2000;nextFrame();assert($('level').value>.1&&$('input-signal').textContent==='Signal detected');assert($('timer').textContent==='1:00'&&$('count').textContent==='0');amplitude=1;now+=16;nextFrame();assert($('input-signal').textContent.includes('Too loud'));
});
await test('Changing the checked device stops the old stream before opening the next',async()=>{
 const previous=tracks.at(-1);$('audio-input').value='mic';$('audio-input').dispatchEvent(new w.Event('change'));await wait(20);assert(previous.stopped);assert(requests.at(-1).audio.deviceId.exact==='mic');assert($('input-status').textContent.includes('Built-in microphone'));
 $('audio-input').value='usb';$('audio-input').dispatchEvent(new w.Event('change'));await wait(20);
});
await test('Practice keeps the chosen USB input and locks selection during the round',async()=>{
 const preview=tracks.at(-1);amplitude=.001;$('listen').click();await wait(20);assert(preview.stopped);assert(requests.at(-1).audio.deviceId.exact==='usb');assert($('audio-input').disabled&&$('check-input').disabled);assert($('status').textContent.includes('quiet'));
 now+=1600;nextFrame();amplitude=.12;now+=16;nextFrame();assert($('count').textContent==='1','first USB strum starts count');
});
await test('Disconnecting USB stops the round and never opens another device',()=>{
 const count=requests.length,active=tracks.at(-1);active.onended();assert(active.stopped);assert(!$('error').hidden&&$('error').textContent.includes('disconnected'));assert(requests.length===count);assert(!$('audio-input').disabled&&$('count').textContent==='0');
});
await test('Missing USB remains selected and fails without microphone fallback',async()=>{
 devices=devices.filter(device=>device.deviceId!=='usb');$('refresh-inputs').click();await wait(20);assert($('audio-input').value==='usb');assert($('audio-input').selectedOptions[0].disabled);
 Object.defineProperty(w.navigator.mediaDevices,'getUserMedia',{configurable:true,value:options=>{requests.push(options);return Promise.reject(new DOMException('Missing','OverconstrainedError'))}});
 const count=requests.length;$('listen').click();await wait(20);assert(requests.length===count+1&&requests.at(-1).audio.deviceId.exact==='usb');assert($('error').textContent.includes('not switched'));assert(!$('listen').hidden);
});
await test('Cancelling a pending input check closes a late-arriving USB stream',async()=>{
 let resolve;Object.defineProperty(w.navigator.mediaDevices,'getUserMedia',{configurable:true,value:()=>new Promise(r=>resolve=r)});
 $('check-input').click();await wait(10);$('cancel').click();const late=makeStream();resolve(late);await wait(10);assert(late.getTracks()[0].stopped);assert($('check-input').textContent==='Check input');
});
await test('Input controls fit a narrow mobile viewport',async()=>{
 frame.width='340';await wait(30);assert(d.documentElement.scrollWidth<=w.innerWidth);
});
document.getElementById('results').textContent=results.join('\n');document.title=results.some(r=>r.startsWith('FAIL'))?'FAIL':'PASS';
</script></body></html>
